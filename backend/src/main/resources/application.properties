# ======================================================
# SERVER
# ======================================================
server.port=${PORT:8080}


# ======================================================
# DATASOURCE (MYSQL - RAILWAY)
# ======================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================
# JPA / HIBERNATE (SAFE MODE)
# ======================================================
# Use validate instead of update to avoid schema changes
spring.jpa.hibernate.ddl-auto=validate

# MySQL dialect (for Hibernate 7.x)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Performance & safety
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ======================================================
# FLYWAY (SCHEMA MANAGEMENT - MYSQL ONLY)
# ======================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# MUST be at least 32 characters
jwt.secret=${JWT_SECRET:WHITEBOARD_V2_SUPER_SECRET_SIGNING_KEY_2025_!@#$}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ======================================================
# LOGGING (CLEAN BUT USEFUL)
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO


# ======================================================
# JACKSON (JSON SAFETY)
# ======================================================
spring.jackson.time-zone=UTC


# ======================================================
# CORS (CONFIGURABLE FOR DEPLOYMENT)
# ======================================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://realtime-collaboration-whiteboard-f.vercel.app/}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
