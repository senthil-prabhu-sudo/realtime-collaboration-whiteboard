# ======================================================
# SERVER (Railway compatible)
# ======================================================
server.port=${PORT:8080}


# ======================================================
# DATASOURCE (MYSQL ? RAILWAY + LOCAL SAFE)
# ======================================================
# IMPORTANT:
# Do NOT use MYSQL_URL (Railway provides mysql:// which is NOT JDBC)
# Always construct JDBC URL using MYSQLHOST, MYSQLPORT, MYSQLDATABASE
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:whiteboard_v2}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================
# JPA / HIBERNATE (SAFE MODE)
# ======================================================
# Use validate in production to avoid schema damage
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Performance & stability
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ======================================================
# FLYWAY (MYSQL ONLY)
# ======================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# MUST be provided in Railway Variables (min 32 chars)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


# ======================================================
# LOGGING (PRODUCTION SAFE)
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO


# ======================================================
# JACKSON
# ======================================================
spring.jackson.time-zone=UTC


# ======================================================
# CORS (LOCAL + VERCEL)
# ======================================================
spring.web.cors.allowed-origins=${CORS_ORIGINS:https://realtime-collaboration-whiteboard-f.vercel.app/}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
