# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# DATASOURCE (Railway / Env-based)
# ===============================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# WEBSOCKET
# ===============================
spring.websocket.path=/ws

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:WHITEBOARD_V2_SUPER_SECRET_SIGNING_KEY_2025_!@#$}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
