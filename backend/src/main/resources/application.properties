# ======================================================
# SERVER (Railway compatible)
# ======================================================
server.port=${PORT:8080}


# ======================================================
# DATASOURCE (MYSQL for production)
# ======================================================
# Railway provides these environment variables:
# MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:whiteboard}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Senthil2004$}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================
# JPA / HIBERNATE (PRODUCTION SAFE)
# ======================================================
# Flyway handles schema creation in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Performance & stability
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ======================================================
# FLYWAY (MYSQL PRODUCTION)
# ======================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# MUST be provided in Railway Variables (min 32 chars)
jwt.secret=${JWT_SECRET:mySuperSecretJWTKeyThatIsAtLeast32CharactersLongForDevelopment}
jwt.expiration-ms=86400000


# ======================================================
# LOGGING (PRODUCTION SAFE)
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO


# ======================================================
# JACKSON
# ======================================================
spring.jackson.time-zone=UTC


# ======================================================
# CORS (LOCAL + VERCEL)
# ======================================================
spring.web.cors.allowed-origins=${CORS_ORIGINS:https://realtime-collaboration-whiteboard-f.vercel.app/}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
