# ======================================================
# SERVER
# ======================================================
# Railway injects PORT automatically
server.port=${PORT:8080}


# ======================================================
# DATASOURCE (MYSQL – RAILWAY)
# ======================================================
# Values are injected from Railway → Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (safe defaults)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


# ======================================================
# JPA / HIBERNATE
# ======================================================
# Use update in production only if Flyway is correct
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Disable SQL spam in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ======================================================
# FLYWAY (DATABASE MIGRATIONS)
# ======================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# Injected from Railway Variables
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


# ======================================================
# LOGGING
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF


# ======================================================
# JACKSON
# ======================================================
spring.jackson.time-zone=UTC


# ======================================================
# CORS (FRONTEND DEPLOYED ON VERCEL)
# ======================================================
spring.web.cors.allowed-origins=https://<your-vercel-domain>.vercel.app
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
