# ======================================================
# SERVER (Render compatible)
# ======================================================
server.port=${PORT:8080}


# ======================================================
# DATASOURCE (AIVEN MYSQL - PRODUCTION)
# ======================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================
# JPA / HIBERNATE (PRODUCTION SAFE)
# ======================================================
# Temporarily allow Hibernate to create missing tables (change back to validate after first successful deployment)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Performance & stability
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ======================================================
# FLYWAY (MYSQL PRODUCTION)
# ======================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# MUST be set in Render Environment Variables (min 32 chars)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000


# ======================================================
# LOGGING (PRODUCTION SAFE)
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO


# ======================================================
# DEBUG LOGGING (TEMPORARY – REMOVE AFTER FIXING ISSUES)
# ======================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.whiteboard.backend.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.com.whiteboard.backend.session=DEBUG

spring.web.error.include-message=always
spring.web.error.include-stacktrace=on_param
spring.web.error.include-binding-errors=always


# ======================================================
# JACKSON
# ======================================================
spring.jackson.time-zone=UTC
