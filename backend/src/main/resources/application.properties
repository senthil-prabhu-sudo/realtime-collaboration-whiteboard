# ======================================================
# SERVER
# ======================================================
server.port=8080


# ======================================================
# DATASOURCE (MYSQL ONLY)
# ======================================================
spring.datasource.url=jdbc:mysql://localhost:3306/whiteboard_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Senthil2004$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================================================
# JPA / HIBERNATE (SAFE MODE)
# ======================================================
# Use validate instead of update to avoid schema changes
spring.jpa.hibernate.ddl-auto=update

# MySQL dialect (for Hibernate 7.x)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Performance & safety
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ======================================================
# FLYWAY (SCHEMA MANAGEMENT - MYSQL ONLY)
# ======================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ======================================================
# WEBSOCKET
# ======================================================
spring.websocket.path=/ws


# ======================================================
# JWT AUTHENTICATION
# ======================================================
# MUST be at least 32 characters
jwt.secret=WHITEBOARD_V2_SUPER_SECRET_SIGNING_KEY_2025_!@#$
jwt.expiration-ms=86400000


# ======================================================
# LOGGING (CLEAN BUT USEFUL)
# ======================================================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF


# ======================================================
# JACKSON (JSON SAFETY)
# ======================================================

spring.jackson.time-zone=UTC


# ======================================================
# CORS (OPTIONAL – SAFE DEFAULT)
# ======================================================
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
